[project]
name = "numeraire"
version = "0.0.2"
description = "Point-in-time financial data + strategy foundation for an automated wealth-creation engine"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    # connectors add: httpx/requests; backtest layer added later (vectorbt/backtrader TBD)
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6"]
serve = [
    "fastapi>=0.139.0",
    "uvicorn>=0.51.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SIM"]
