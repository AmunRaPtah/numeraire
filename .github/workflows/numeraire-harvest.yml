name: numeraire-harvest

# Runs the numeraire data harvest on GitHub Actions instead of the Contabo VPS
# (ingest-universe + warehouse build OOMed and got killed on the 8GB box). Mirrors
# aqueduct-harvest.yml exactly. State (data/: raw + warehouse) is stored as a single
# state.tgz archive on OneDrive and pulled/pushed via rclone.
on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 6 * * 1'   # weekly Monday 06:00 UTC

concurrency:
  group: numeraire-harvest
  cancel-in-progress: true

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install rclone (latest) + package
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version
          python -m pip install -U pip
          pip install -e .
      - name: Restore secrets (rclone config)
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
      - name: Pull warehouse state from OneDrive
        run: |
          mkdir -p data
          if rclone copyto onedrive:numeraire-state/state.tgz state.tgz --onedrive-chunk-size 100M --stats 30s; then
            tar -xzf state.tgz -C data && rm -f state.tgz
          else
            echo "No state.tgz on OneDrive yet — starting from an empty data/"
          fi
          du -sh data 2>/dev/null || true
      - name: Pull aqueduct warehouse (read-only, for the pipeline bridge)
        continue-on-error: true
        run: |
          mkdir -p aqueduct-data
          if rclone copyto onedrive:aqueduct-state/state.tgz aq-state.tgz --onedrive-chunk-size 100M --stats 30s; then
            tar -xzf aq-state.tgz -C aqueduct-data && rm -f aq-state.tgz
          else
            echo "No aqueduct state.tgz on OneDrive — pipeline bridge will skip"
          fi
      - name: Harvest (membership + security master + EDGAR fundamentals + prices + estimates + crypto + pharma edge)
        env:
          NUMERAIRE_AQUEDUCT_DB: ${{ github.workspace }}/aqueduct-data/warehouse.duckdb
        run: |
          python -m numeraire sp500
          python -m numeraire secmaster
          python -m numeraire ingest-universe
          python -m numeraire prices-universe
          python -m numeraire estimates-universe
          python -m numeraire crypto
          python -m numeraire fda-universe
          python -m numeraire pipeline-universe
      - name: Push updated warehouse state to OneDrive
        run: |
          tar -czf state.tgz -C data --exclude='*.wal' .
          rclone copyto state.tgz onedrive:numeraire-state/state.tgz --onedrive-chunk-size 100M --stats 30s
